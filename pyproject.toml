[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quick-python-ide"
version = "0.1.0"
description = "A minimal Python IDE built on pywebview (UI external to the executable)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "yang" }]
keywords = ["ide", "python", "pywebview", "editor"]
dependencies = ["pywebview>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
